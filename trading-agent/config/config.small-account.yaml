# Configuration for a small funded account (~$1,000-$5,000), Robinhood agentic.
#
# WHY EQUITIES AND NOT OPTIONS AT THIS SIZE
# The cheapest defined-risk options spread on a liquid underlying risks roughly
# $70-100 per contract. At $2,000 equity, a disciplined 2% position limit is $40
# - so every options proposal would be rejected, forever. The alternatives are
# to raise the position limit to ~5% (one contract, wildly concentrated, no
# diversification) or to trade equities until the account can size options
# properly. This config takes the second path.
#
# Robinhood supports fractional shares, so a $40 position works on any
# underlying regardless of share price. Switch to config.example.yaml (options
# setups) once equity clears roughly $10,000. Run `tagent doctor --equity <bal>`
# after any change - it checks that your limits can actually fund a trade.

db_path: /data/tagent.db

# Places no orders. Flip to false only when `tagent discover` has confirmed the
# tool bindings and a dry-run day looks sane in `tagent status`.
dry_run: true

broker:
  kind: robinhood_mcp
  paper: false
  mcp_url: https://agent.robinhood.com/mcp/trading
  # Must stay READ-WRITE. Refresh tokens are single-use; a read-only mount
  # destroys the session on first refresh.
  token_file: /data/robinhood-tokens.enc

limits:
  max_position_pct: 0.02        # $40 at $2k
  max_symbol_pct: 0.04          # at most two positions per name
  max_deployed_pct: 0.30        # keep most of a small account in cash

  daily_loss_limit_pct: 0.03    # stop after a 3% down day
  max_drawdown_pct: 0.15        # latched kill switch

  # Three trades a day, not eight. At $40 a position the edge has to beat a
  # fixed cost floor, and small accounts are where overtrading does the most
  # damage relative to capital.
  max_trades_per_day: 3
  max_trades_per_cycle: 1

  min_edge_cost_multiple: 2.5   # stricter than default: costs bite harder here
  max_spread_pct: 0.01          # liquid equities only

  min_dte: 20                   # unused while trading equities; kept honest
  require_defined_risk: true

  entry_blackout_minutes_open: 15
  entry_blackout_minutes_close: 20
  max_data_age_seconds: 120
  allow_reentry_same_day: false

# COST NOTE (matters more than anything else at this account size)
# The model call, not the VM, is the dominant running expense. At a 20-minute
# cadence with Opus 5 it runs ~$272/yr - 14% of a $2,000 account, before the
# agent has made a cent. Hourly costs ~$106/yr (5%), and the research is
# unambiguous that lower trade frequency IMPROVES retail returns, so this is
# cheaper and probably better. Revisit the cadence when the account is larger.
agent:
  model: claude-opus-5
  interval_minutes: 60
  max_context_lessons: 25
  max_similar_decisions: 5

  # Narrow and liquid. A wider universe multiplies the ways to be wrong without
  # multiplying edge, and thin names blow the spread limit anyway.
  universe:
    - SPY
    - QQQ
    - IWM
    - AAPL
    - MSFT
    - NVDA

  # Named so realized expectancy is attributable per strategy family. The agent
  # must tag every proposal with one of these.
  setups:
    - gap_fade
    - trend_pullback
    - range_reversion
    - momentum_continuation

alerts:
  on_auth_expired: true
  on_kill_switch: true
  on_gate_reject_streak: 5
  webhook_env_var: TAGENT_ALERT_WEBHOOK
